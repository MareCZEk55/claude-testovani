<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Had</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --accent:#22c55e; --food:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:12px; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action:manipulation; }
  h1 { margin:0; font-size:1.6rem; }
  .bar { display:flex; gap:20px; font-size:1rem; }
  canvas { background:var(--panel); border-radius:10px; width:min(92vw, 420px); height:auto;
           aspect-ratio:1; touch-action:none; }
  button { font:inherit; padding:.5rem 1.2rem; border:0; border-radius:8px;
           background:var(--accent); color:#052e16; font-weight:600; cursor:pointer; }
  .pad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,56px); gap:6px; }
  .pad button { padding:0; font-size:1.3rem; background:var(--panel); color:var(--text); }
  .pad .up { grid-column:2; } .pad .l { grid-row:2; grid-column:1; }
  .pad .d { grid-row:2; grid-column:2; } .pad .r { grid-row:2; grid-column:3; }
  small { color:#94a3b8; }
</style>
</head>
<body>
  <h1>🐍 Had</h1>
  <div class="bar"><span>Skóre: <b id="score">0</b></span><span>Rekord: <b id="best">0</b></span></div>
  <canvas id="c" width="420" height="420"></canvas>
  <div class="pad">
    <button class="up" data-d="up">▲</button>
    <button class="l" data-d="left">◀</button>
    <button class="d" data-d="down">▼</button>
    <button class="r" data-d="right">▶</button>
  </div>
  <button id="start">Nová hra</button>
  <small>Šipky / WASD, mezerník = pauza, na mobilu swipe nebo tlačítka</small>

<script>
const N = 21, S = 420 / N;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
let snake, dir, nextDir, food, score, timer, running, paused;
let best = 0;
try { best = +localStorage.getItem('hadBest') || 0; } catch (e) {}
bestEl.textContent = best;

function placeFood() {
  do { food = [Math.floor(Math.random()*N), Math.floor(Math.random()*N)]; }
  while (snake.some(s => s[0]===food[0] && s[1]===food[1]));
}
function start() {
  snake = [[10,10],[9,10],[8,10]]; dir = nextDir = DIRS.right;
  score = 0; scoreEl.textContent = 0; running = true; paused = false;
  placeFood(); clearInterval(timer); timer = setInterval(tick, 120); draw();
}
function turn(name) {
  const d = DIRS[name];
  if (d[0] + dir[0] !== 0 || d[1] + dir[1] !== 0) nextDir = d;
}
function tick() {
  if (!running || paused) return;
  dir = nextDir;
  const head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
  if (head[0]<0 || head[1]<0 || head[0]>=N || head[1]>=N ||
      snake.some(s => s[0]===head[0] && s[1]===head[1])) return gameOver();
  snake.unshift(head);
  if (head[0]===food[0] && head[1]===food[1]) {
    score++; scoreEl.textContent = score; placeFood();
    if (score > best) { best = score; bestEl.textContent = best;
      try { localStorage.setItem('hadBest', best); } catch (e) {} }
  } else snake.pop();
  draw();
}
function gameOver() {
  running = false; clearInterval(timer); draw();
  ctx.fillStyle = 'rgba(15,23,42,.75)'; ctx.fillRect(0,0,420,420);
  ctx.fillStyle = '#e2e8f0'; ctx.textAlign = 'center';
  ctx.font = 'bold 32px system-ui'; ctx.fillText('Konec hry', 210, 200);
  ctx.font = '18px system-ui'; ctx.fillText('Skóre: ' + score, 210, 235);
}
function draw() {
  ctx.clearRect(0,0,420,420);
  ctx.fillStyle = '#ef4444'; ctx.beginPath();
  ctx.arc(food[0]*S+S/2, food[1]*S+S/2, S/2-2, 0, 7); ctx.fill();
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#4ade80' : '#22c55e';
    ctx.fillRect(s[0]*S+1, s[1]*S+1, S-2, S-2);
  });
}
addEventListener('keydown', e => {
  const k = { ArrowUp:'up', w:'up', ArrowDown:'down', s:'down', ArrowLeft:'left', a:'left', ArrowRight:'right', d:'right' }[e.key];
  if (k) { e.preventDefault(); turn(k); }
  else if (e.key === ' ') { e.preventDefault(); if (running) paused = !paused; }
});
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => turn(b.dataset.d)));
document.getElementById('start').addEventListener('click', start);
let tx, ty;
cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}, { passive:true });
start();
</script>
</body>
</html>
